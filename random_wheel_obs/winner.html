<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Winner Display</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@500;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="style_graphics.css">
</head>
<body>
    <div class="winner-overlay" id="winner-overlay">
        <div class="winner-box">
            <p>ผลการจับคู่คือ</p>
            <div class="winner-display">
                <div id="winner-part1" class="winner-line1"></div>
                <div id="winner-logo-container" style="margin-top: 15px; display: none; justify-content: center; margin-bottom: 15px;">
                    <img id="winner-logo-img" src="" style="width: 120px; height: 120px; border-radius: 50%; object-fit: contain; background: white; border: 3px solid rgba(255,255,255,0.2); box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
                </div>
                <div id="winner-part2" class="winner-line2"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
